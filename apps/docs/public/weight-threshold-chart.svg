<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="640" height="320" fill="#fafafa" rx="8"/>

  <!-- Header -->
  <text x="60" y="30" font-size="13" fill="#666">520k / 500k threshold</text>
  <text x="440" y="30" font-size="13" fill="#16a34a" font-weight="600">100% · accepted</text>

  <!-- Chart area -->
  <rect x="60" y="45" width="540" height="220" fill="#f0f4ff" rx="4" opacity="0.5"/>

  <!-- Y axis labels -->
  <text x="50" y="72" font-size="11" fill="#999" text-anchor="end">500k</text>
  <text x="50" y="127" font-size="11" fill="#999" text-anchor="end">400k</text>
  <text x="50" y="182" font-size="11" fill="#999" text-anchor="end">200k</text>
  <text x="50" y="260" font-size="11" fill="#999" text-anchor="end">0</text>

  <!-- Threshold line -->
  <line x1="60" y1="68" x2="600" y2="68" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="608" y="62" font-size="11" fill="#f59e0b" font-weight="500">threshold</text>

  <!-- Initiative B (crosses threshold) - stepped line -->
  <polyline
    points="60,250 100,230 140,220 180,210 200,195 240,180 260,170 300,140 320,130 360,110 380,95 420,80 440,70 480,62 520,58 560,56 580,55"
    fill="none"
    stroke="#4f46e5"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Accepted dot -->
  <circle cx="480" cy="62" r="5" fill="#4f46e5" stroke="white" stroke-width="2"/>
  <circle cx="480" cy="62" r="8" fill="none" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Initiative A (below threshold) - stepped line -->
  <polyline
    points="60,250 100,240 140,230 180,215 200,200 240,185 260,175 300,165 320,160 360,158 380,160 420,165 440,170 480,178 520,185 560,192 580,198"
    fill="none"
    stroke="#a1a1aa"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-dasharray="4,3"
  />

  <!-- Labels for lines -->
  <text x="585" y="52" font-size="11" fill="#4f46e5" font-weight="600">Initiative B</text>
  <text x="585" y="202" font-size="11" fill="#a1a1aa" font-weight="500">Initiative A</text>

  <!-- X axis labels -->
  <text x="60" y="282" font-size="11" fill="#999">Day 1</text>
  <text x="200" y="282" font-size="11" fill="#999">Day 5</text>
  <text x="340" y="282" font-size="11" fill="#999">Day 10</text>
  <text x="480" y="282" font-size="11" fill="#999">Day 15</text>
  <text x="580" y="282" font-size="11" fill="#999">Day 20</text>

  <!-- Axis label -->
  <text x="320" y="305" font-size="12" fill="#666" text-anchor="middle">Time (intervals)</text>
</svg>