<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="640" height="380" fill="#fafafa" rx="8"/>

  <!-- Pool -->
  <rect x="220" y="20" width="200" height="70" rx="10" fill="#4f46e5" opacity="0.1" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="320" y="48" font-size="14" fill="#4f46e5" font-weight="600" text-anchor="middle">IncentivesPool</text>
  <text x="320" y="70" font-size="12" fill="#4f46e5" text-anchor="middle">100,000 USDC</text>

  <!-- Connecting lines from pool to boards -->
  <line x1="260" y1="90" x2="120" y2="150" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="320" y1="90" x2="320" y2="150" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="380" y1="90" x2="520" y2="150" stroke="#a1a1aa" stroke-width="1.5"/>

  <!-- approveBoard labels -->
  <text x="172" y="118" font-size="9" fill="#999" transform="rotate(-25, 172, 118)">approveBoard()</text>
  <text x="328" y="125" font-size="9" fill="#999">approveBoard()</text>
  <text x="432" y="118" font-size="9" fill="#999" transform="rotate(25, 432, 118)">approveBoard()</text>

  <!-- Board 1: Infrastructure -->
  <rect x="30" y="150" width="180" height="60" rx="8" fill="#16a34a" opacity="0.1" stroke="#16a34a" stroke-width="1.5"/>
  <text x="120" y="175" font-size="12" fill="#16a34a" font-weight="600" text-anchor="middle">Infrastructure Board</text>
  <text x="120" y="195" font-size="11" fill="#16a34a" text-anchor="middle">max 15,000 per initiative</text>

  <!-- Board 2: Events -->
  <rect x="230" y="150" width="180" height="60" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="175" font-size="12" fill="#f59e0b" font-weight="600" text-anchor="middle">Events Board</text>
  <text x="320" y="195" font-size="11" fill="#f59e0b" text-anchor="middle">max 5,000 per initiative</text>

  <!-- Board 3: Grants -->
  <rect x="430" y="150" width="180" height="60" rx="8" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="520" y="175" font-size="12" fill="#8b5cf6" font-weight="600" text-anchor="middle">Grants Board</text>
  <text x="520" y="195" font-size="11" fill="#8b5cf6" text-anchor="middle">max 20,000 per initiative</text>

  <!-- Lines from boards to initiatives -->
  <!-- Board 1 initiatives -->
  <line x1="80" y1="210" x2="60" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="120" y1="210" x2="120" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="160" y1="210" x2="180" y2="260" stroke="#d1d5db" stroke-width="1"/>

  <!-- Board 2 initiatives -->
  <line x1="280" y1="210" x2="265" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="320" y1="210" x2="320" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="360" y1="210" x2="375" y2="260" stroke="#d1d5db" stroke-width="1"/>

  <!-- Board 3 initiatives -->
  <line x1="480" y1="210" x2="465" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="520" y1="210" x2="520" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="560" y1="210" x2="575" y2="260" stroke="#d1d5db" stroke-width="1"/>

  <!-- Board 1 initiatives -->
  <rect x="35" y="260" width="50" height="36" rx="5" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="1"/>
  <text x="60" y="276" font-size="8" fill="#16a34a" font-weight="500" text-anchor="middle">Accepted</text>
  <text x="60" y="288" font-size="8" fill="#16a34a" text-anchor="middle">15,000</text>

  <rect x="95" y="260" width="50" height="36" rx="5" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="1"/>
  <text x="120" y="276" font-size="8" fill="#16a34a" font-weight="500" text-anchor="middle">Accepted</text>
  <text x="120" y="288" font-size="8" fill="#16a34a" text-anchor="middle">15,000</text>

  <rect x="155" y="260" width="50" height="36" rx="5" fill="#d1d5db" opacity="0.3" stroke="#d1d5db" stroke-width="1"/>
  <text x="180" y="276" font-size="8" fill="#999" font-weight="500" text-anchor="middle">Proposed</text>
  <text x="180" y="288" font-size="8" fill="#999" text-anchor="middle">—</text>

  <!-- Board 2 initiatives -->
  <rect x="240" y="260" width="50" height="36" rx="5" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="265" y="276" font-size="8" fill="#f59e0b" font-weight="500" text-anchor="middle">Accepted</text>
  <text x="265" y="288" font-size="8" fill="#f59e0b" text-anchor="middle">5,000</text>

  <rect x="295" y="260" width="50" height="36" rx="5" fill="#d1d5db" opacity="0.3" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="276" font-size="8" fill="#999" font-weight="500" text-anchor="middle">Proposed</text>
  <text x="320" y="288" font-size="8" fill="#999" text-anchor="middle">—</text>

  <rect x="350" y="260" width="50" height="36" rx="5" fill="#d1d5db" opacity="0.3" stroke="#d1d5db" stroke-width="1"/>
  <text x="375" y="276" font-size="8" fill="#999" font-weight="500" text-anchor="middle">Proposed</text>
  <text x="375" y="288" font-size="8" fill="#999" text-anchor="middle">—</text>

  <!-- Board 3 initiatives -->
  <rect x="440" y="260" width="50" height="36" rx="5" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="465" y="276" font-size="8" fill="#8b5cf6" font-weight="500" text-anchor="middle">Accepted</text>
  <text x="465" y="288" font-size="8" fill="#8b5cf6" text-anchor="middle">20,000</text>

  <rect x="495" y="260" width="50" height="36" rx="5" fill="#d1d5db" opacity="0.3" stroke="#d1d5db" stroke-width="1"/>
  <text x="520" y="276" font-size="8" fill="#999" font-weight="500" text-anchor="middle">Expired</text>
  <text x="520" y="288" font-size="8" fill="#999" text-anchor="middle">—</text>

  <rect x="550" y="260" width="50" height="36" rx="5" fill="#d1d5db" opacity="0.3" stroke="#d1d5db" stroke-width="1"/>
  <text x="575" y="276" font-size="8" fill="#999" font-weight="500" text-anchor="middle">Proposed</text>
  <text x="575" y="288" font-size="8" fill="#999" text-anchor="middle">—</text>

  <!-- Summary bar -->
  <rect x="30" y="320" width="580" height="44" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="340" font-size="11" fill="#666">Distributed:</text>
  <text x="130" y="340" font-size="11" fill="#111" font-weight="600">55,000</text>
  <text x="240" y="340" font-size="11" fill="#666">Remaining in pool:</text>
  <text x="380" y="340" font-size="11" fill="#4f46e5" font-weight="600">45,000</text>
  <text x="480" y="340" font-size="11" fill="#666">Available for future acceptances</text>
</svg>